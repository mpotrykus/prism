<!-- connect-src/img-src/media-src stay open: the Plex server is user-supplied (any LAN
     host/IP), so it can't be pinned to a fixed allowlist. script-src/style-src need
     'unsafe-inline' for the one inline onerror= handler in title-info.js and the inline
     @font-face block below. frame-src is scoped to YouTube's trailer embed. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src * blob:; connect-src *; frame-src https://www.youtube.com; object-src 'none'; base-uri 'self';" />

  html { scrollbar-width: none; }
  ::-webkit-scrollbar { display: none; width: 0; height: 0; }

  /* Registered here, not inside plex-netflix-card's shadow-scoped CSS -
     @font-face inside that shadow root never registers with the browser's
     font engine (confirmed: no network request for the file, empty
     document.fonts), silently falling back to sans-serif. Font lookup by
     name for shadow-tree elements still consults this document-level
     registration though, so .rank-number's font-family: "Anton" in
     rows-poster.css picks this up fine. */
  @font-face {
    font-family: "Anton";
    font-style: normal;
    font-weight: 400;
    src: url("./assets/fonts/Anton-Regular.ttf") format("truetype");
  }
